# Local Postgres for UniformDesk (dev + tests)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uniformdesk
    volumes:
      - uniformdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uniformdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uniformdesk_pg:
