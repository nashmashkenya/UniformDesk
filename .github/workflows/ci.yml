name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
      AUTH_SECRET: ci-auth-secret-uniformdesk-do-not-use-live
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Domain tests
        run: npm test

      - name: Production build
        run: npm run build
