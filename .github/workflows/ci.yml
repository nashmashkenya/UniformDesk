name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uniformdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uniformdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uniformdesk?schema=public
      AUTH_SECRET: ci-auth-secret-uniformdesk-do-not-use-live
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Domain tests
        run: npm test

      - name: Production build
        run: npm run build
