# Railway deploy defaults for UniformDesk (Next.js + Prisma Postgres)
# Migrate on start (not build): DATABASE_URL is reliably available at runtime.
# Nixpacks already installs deps — do not add npm ci to buildCommand.
[build]
builder = "NIXPACKS"
buildCommand = "rm -rf .next && npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && npm run start"
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
